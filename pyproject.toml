[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bullet-sim"
version = "0.1.0"
description = "Reusable 2D dynamic-obstacle (bullet-hell) simulation platform for virtual training, CPU/FPGA deployment and real 2D cart validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bullet Platform Team" }]
keywords = ["simulation", "bullet-hell", "reinforcement-learning", "fpga", "robotics", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Simulation",
]

# NumPy is the ONLY hard dependency: the core simulator, dataset layer,
# benchmark suites, CLI and test suite all work with it alone.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
render = ["pygame>=2.1"]
plots = ["matplotlib>=3.6"]
test = ["pytest>=7"]
dev = ["pytest>=7", "matplotlib>=3.6", "pygame>=2.1"]
# 键盘桥那套 PC 侧工具要读串口：core/rp2040_keyboard/{console_relay,pc_key_driver}.py
serial = ["pyserial>=3.5"]

[project.scripts]
bullet-sim = "bullet_sim.cli:main"

[project.urls]
Documentation = "core/bullet_sim/docs/ARCHITECTURE.md"

# All module source lives under core/ (core/bullet_sim, core/cpu, core/fpga,
# core/vision); the repository root only holds the driver scripts that call it.
# `cpu`、`fpga` 与 `vision` **必须列上**：漏了它们，干净 `pip install .` 装出来的包
# 缺三个模块，而仓库内开发（conftest 往 sys.path 塞 core/）看不出问题 ——
# 交付要求是"可复现工程"，这一步不能只在开发者机器上成立。
[tool.setuptools.packages.find]
where = ["core"]
include = ["bullet_sim*", "cpu*", "fpga*", "harness*", "vision*", "standard*"]

[tool.setuptools.package-data]
bullet_sim = ["docs/*.md", "configs/*.json"]
fpga = ["rtl/*.v", "rtl/*.vh", "ref/*.c", "ref/*.h", "ref/*.py",
        "cosim/*.cpp", "cosim/Makefile", "docs/*.md"]

[tool.pytest.ini_options]
# `core/cpu/tests` 与 `core/harness/tests` 也在里面：漏掉时裸 `pytest` 会
# **静默跳过**这两个模块（含闭环端到端），"本地全绿"就是个假象。
# ⚠ `core/board/tests` 是同一个坑，2026-10-12 才补上：新加的几何帧对账 8 条
#   用例当时**根本没被收集**，裸 `pytest` 照样报 830 全绿。
#   **加新模块时一定要把它加进这一行**，否则新测试永远不跑。
testpaths = ["core/bullet_sim/tests", "core/cpu/tests", "core/fpga/tests",
             "core/board/tests", "core/harness/tests", "core/vision/tests",
             "core/standard/tests"]
filterwarnings = ["error::DeprecationWarning:bullet_sim.*"]
